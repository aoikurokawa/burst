[package]
name = "burst"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusoto_ec2 = "0.48.0"
rusoto_dynamodb = "0.48.0"
rusoto_credential = "0.48.0"
rusoto_core = "0.48.0"
ssh2 = "0.9.4"
tokio = { version = "1", features = ["full"] }

# Only used by the examples.
[dev-dependencies]
clap = { version = "4", features = ["derive", "env"] }
solana-commitment-config = "3"
solana-keypair = "3"
solana-message = "4.2"
# `curve25519` is what makes off-chain `find_program_address` available.
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-rpc-client = "4.2"
solana-signer = "3"
# `bincode` is what makes `instruction::transfer` available.
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "4.1"
